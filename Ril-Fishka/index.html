<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ril-Fishka — Фишинг или реальность?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #5d1a89;
    min-height: 100vh;
    color: #222;
    display: flex;
    flex-direction: column;
  }

  header {
    position: relative;
    width: 100%;
    height: 110px;
    background-image: url('header.jpg');
    background-size: cover;
    background-position: center;
    background-color: #3d0f5c;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(61, 15, 92, 0.35);
  }
  .header-inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 20px;
  }
  .header-logo {
    width: 120px;
    height: 120px;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .header-title {
    font-size: 42px;
    font-weight: 800;
    color: #e932ec;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(233, 50, 236, 0.8), 0 3px 8px rgba(0,0,0,0.6);
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    width: 100%;
    flex: 1;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    margin-top: 30px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1 { font-size: 28px; margin-bottom: 12px; color: #5d1a89; }
  h2 { font-size: 20px; margin-bottom: 16px; }
  .subtitle { font-size: 18px; color: #555; margin-bottom: 16px; }
  .desc { color: #666; margin-bottom: 24px; line-height: 1.5; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    padding: 14px 24px;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  button:active { transform: translateY(0); }
  .btn-main {
    background: #5d1a89;
    color: #fff;
    width: 100%;
    font-size: 18px;
    font-weight: 600;
  }
  .btn-main:hover { background: #48116b; }
  .btn-real {
    background: #2e9e5b;
    color: #fff;
    flex: 1;
  }
  .btn-real:hover { background: #248049; }
  .btn-phish {
    background: #d9534f;
    color: #fff;
    flex: 1;
  }
  .btn-phish:hover { background: #b93f3b; }
  .answers { display: flex; gap: 14px; margin-top: 20px; }
  .situation {
    background: #f6f0fb;
    border-left: 4px solid #5d1a89;
    padding: 16px;
    border-radius: 8px;
    line-height: 1.5;
    font-size: 16px;
  }
  .progress { font-size: 14px; color: #888; margin-bottom: 10px; }
  .progress-bar {
    height: 6px;
    background: #e6dcf0;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: #5d1a89;
    transition: width 0.4s ease;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  .popup {
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    animation: pop 0.25s ease;
  }
  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .popup .verdict { font-size: 40px; margin-bottom: 10px; }
  .popup .verdict-text { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .popup .correct { color: #2e9e5b; }
  .popup .wrong { color: #d9534f; }
  .popup .explain { color: #555; line-height: 1.55; margin-bottom: 22px; }
  .result-emoji { font-size: 60px; text-align: center; margin-bottom: 16px; }
  .result-title { text-align: center; font-size: 24px; color: #5d1a89; margin-bottom: 10px; }
  .result-score { text-align: center; font-size: 18px; color: #666; margin-bottom: 24px; }
  footer {
    background: #3d0f5c;
    color: #e2d3f0;
    padding: 24px 20px;
    margin-top: 40px;
  }
  footer h3 { color: #fff; font-size: 16px; margin-bottom: 12px; }
  footer ul { list-style: none; }
  footer li { padding: 5px 0; font-size: 14px; }
  footer li::before { content: "✔ "; color: #b98ce0; }

  @media (max-width: 520px) {
    header { height: 160px; }
    .header-logo { width: 60px; height: 60px; }
    .header-title { font-size: 26px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo.png" alt="Ril-Fishka" class="header-logo">
    <div class="header-title">Ril-Fishka</div>
  </div>
</header>

<div class="container" id="app"></div>

<footer>
  <div class="container" style="padding:0;">
    <h3>🛡️ Чек-лист безопасности</h3>
    <ul>
      <li>Проверяй буквы в адресной строке.</li>
      <li>Не переходи по ссылкам с угрозами или обещаниями денег.</li>
      <li>Включи двухфакторную аутентификацию.</li>
    </ul>
  </div>
</footer>

<script>
const allQuestions = [
  {
    situation: 'Письмо: «Карта заблокирована, подтвердите данные за 2 часа», ссылка vtb-poddrezhka-24.ru.',
    answer: 'phish',
    explain: 'Банки не угрожают блокировкой; странный домен.'
  },
  {
    situation: 'Друг прислал ссылку на бесплатный Premium: telegram-rewards.com, просят номер и код из SMS.',
    answer: 'phish',
    explain: 'Взломанные аккаунты рассылают спам; код из SMS угоняет профиль.'
  },
  {
    situation: 'Покупка на Авито. Продавец даёт ссылку https://avito.ru, есть значок замочка.',
    answer: 'real',
    explain: 'Официальный домен без лишних символов, HTTPS.'
  },
  {
    situation: 'Знакомая просит проголосовать на konkurs-deti-vsedoma.ru, вход через ВК.',
    answer: 'phish',
    explain: 'Фальшивая форма входа крадёт пароли.'
  },
  {
    situation: 'Письмо о штрафе от no-reply@gosuslugi.ru с ФИО и кнопкой на официальный портал.',
    answer: 'real',
    explain: 'Официальный домен, нет требования вводить пароли в письме.'
  },
  {
    situation: 'СМС: «Ваша посылка задержана. Оплатите 50 ₽ по ссылке pochta-dostavka.top».',
    answer: 'phish',
    explain: 'Мелкая сумма усыпляет бдительность, а домен — поддельный. У «Почты России» домен pochta.ru.'
  },
  {
    situation: 'Звонок «из службы безопасности банка»: просят назвать код из СМС, чтобы «отменить перевод».',
    answer: 'phish',
    explain: 'Настоящий банк никогда не спрашивает код из СМС. Код — только для тебя.'
  },
  {
    situation: 'Письмо от «Сбербанка» с адреса sber@online-sberbank.ru о «новой системе защиты».',
    answer: 'phish',
    explain: 'Домен online-sberbank.ru — не sberbank.ru. Официальные письма приходят с корпоративных доменов.'
  },
  {
    situation: 'Вакансия: «Работа на дому, 5000 ₽ в день, напишите в Telegram».',
    answer: 'phish',
    explain: 'Слишком высокая оплата за простую работу — классический признак мошенничества.'
  },
  {
    situation: 'Письмо от Госуслуг: «Вход в ваш аккаунт с нового устройства», ссылка на gosuslugi.ru.',
    answer: 'real',
    explain: 'Официальный домен. Такое письмо — обычное уведомление системы безопасности.'
  },
  {
    situation: 'СМС: «Списание 8500 ₽. Если это не вы — позвоните по номеру 8-800-...».',
    answer: 'phish',
    explain: 'Мошенники пугают списанием и подсовывают свой номер. Звони только по номеру с обратной стороны карты.'
  },
  {
    situation: 'Продавец на Ozon присылает ссылку https://ozon.ru/... для «прямой оплаты без комиссии».',
    answer: 'real',
    explain: 'Официальный домен ozon.ru. Оплата внутри маркетплейса — нормальная практика.'
  },
  {
    situation: 'В WhatsApp пишет «мама»: «Скинь 10 000 ₽, я попала в беду, потом объясню».',
    answer: 'phish',
    explain: 'Мошенники взламывают аккаунты и просят деньги от имени близких. Позвони человеку по обычному номеру.'
  },
  {
    situation: 'Вы заходите на сайт банка, набрав адрес вручную: https://sberbank.ru. Значок замочка есть.',
    answer: 'real',
    explain: 'Официальный домен, HTTPS. Адрес набран вручную, без переходов по ссылкам из писем.'
  },
  {
    situation: 'Письмо: «Вы выиграли iPhone! Оплатите доставку 990 ₽ по ссылке».',
    answer: 'phish',
    explain: 'Настоящие розыгрыши не требуют предоплаты. «Выигрыш с доплатой» — всегда обман.'
  },
  {
    situation: 'Банк присылает пуш в приложении: «Операция 1200 ₽ подтверждена». Вы её совершали.',
    answer: 'real',
    explain: 'Это уведомление из официального приложения банка, а не письмо со ссылкой.'
  },
  {
    situation: 'На сайте знакомств просят перевести общение в Telegram и «инвестировать» в крипту.',
    answer: 'phish',
    explain: 'Схема «романтического скама»: сначала доверие, потом предложение вложить деньги.'
  },
  {
    situation: 'Курьерская служба пишет: «Уточните адрес доставки» с ссылкой cdek-info.ru.',
    answer: 'phish',
    explain: 'Официальный сайт СДЭК — cdek.ru. Приставки вроде «-info» — типичный приём мошенников.'
  },
  {
    situation: 'Вы вручную ввели адрес https://mos.ru и оплатили коммунальные услуги.',
    answer: 'real',
    explain: 'Официальный портал mos.ru. Адрес набран вручную, оплата на государственном сайте.'
  },
  {
    situation: 'В комментариях под постом пишут: «Ты выиграл подписку, напиши свой логин и пароль в личку».',
    answer: 'phish',
    explain: 'Никогда и никому не сообщай логин и пароль — ни в личке, ни на сайтах-двойниках.'
  }
];

const QUESTIONS_PER_ROUND = 12;

let round = [];
let current = 0;
let score = 0;
let answered = false;

const app = document.getElementById('app');

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickQuestions() {
  return shuffle(allQuestions).slice(0, QUESTIONS_PER_ROUND);
}

function renderStart() {
  app.innerHTML = `
    <div class="card">
      <h1>Фишинг или реальность?</h1>
      <p class="subtitle">Проверь, сможешь ли ты распознать интернет-мошенников.</p>
      <p class="desc">Интерактивный квиз из ${QUESTIONS_PER_ROUND} случайных вопросов (в базе — ${allQuestions.length}) для проверки цифровой грамотности.</p>
      <button class="btn-main" onclick="startQuiz()">Начать тест</button>
    </div>
  `;
}

function startQuiz() {
  round = pickQuestions();
  current = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = round[current];
  const percent = (current / round.length) * 100;

  app.innerHTML = `
    <div class="card">
      <div class="progress">Вопрос ${current + 1} из ${round.length}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
      <h2>Ситуация:</h2>
      <div class="situation">${q.situation}</div>
      <div class="answers">
        <button class="btn-real" onclick="answer('real')">Реальность</button>
        <button class="btn-phish" onclick="answer('phish')">Фишинг</button>
      </div>
    </div>
  `;
}

function answer(choice) {
  if (answered) return;
  answered = true;

  const q = round[current];
  const isCorrect = choice === q.answer;
  if (isCorrect) score++;

  const verdictEmoji = isCorrect ? '✅' : '❌';
  const verdictText = isCorrect
    ? '<span class="correct">Верно!</span>'
    : `<span class="wrong">Неверно. Правильный ответ: ${q.answer === 'real' ? 'Реальность' : 'Фишинг'}.</span>`;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="popup">
      <div class="verdict">${verdictEmoji}</div>
      <div class="verdict-text">${verdictText}</div>
      <p class="explain">${q.explain}</p>
      <button class="btn-main" onclick="nextQuestion()">
        ${current < round.length - 1 ? 'Далее' : 'Показать результат'}
      </button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function nextQuestion() {
  const overlay = document.querySelector('.overlay');
  if (overlay) overlay.remove();

  current++;
  if (current < round.length) {
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  const total = round.length;
  const percent = (score / total) * 100;

  let emoji, title;
  if (percent <= 40) {
    emoji = '🚨';
    title = 'Ты в зоне риска!';
  } else if (percent < 100) {
    emoji = '🛡️';
    title = 'Хороший результат!';
  } else {
    emoji = '🥷';
    title = 'Магистр кибербезопасности!';
  }

  app.innerHTML = `
    <div class="card">
      <div class="result-emoji">${emoji}</div>
      <h2 class="result-title">${title}</h2>
      <p class="result-score">Правильных ответов: ${score} из ${total}</p>
      <button class="btn-main" onclick="startQuiz()">Пройти ещё раз</button>
    </div>
  `;
}

renderStart();
</script>

</body>
</html>
